<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>包裹遞送助手</title>
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --text:#1d2330; --muted:#6b7385; --line:#e3e7ee;
  --primary:#1f6feb; --primary-soft:#e7f0ff; --ok:#1a9c5b; --ok-soft:#e3f6ec;
  --warn:#d9480f; --danger:#d63c3c;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1218;--card:#1a1f29;--text:#e8ebf2;--muted:#9099ab;--line:#2a3140;
  --primary:#4c8dff;--primary-soft:#1c2a44;--ok:#38c37f;--ok-soft:#173326;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--card)}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 120px}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;padding:10px 12px calc(10px);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hrow{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px}
.hrow select{flex:1;min-width:0;font-size:20px;font-weight:700;border:0;border-radius:8px;padding:6px 8px;background:rgba(255,255,255,.15);color:#fff}
.hrow select option{color:#000}
.hbtn{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:8px 10px;font-size:15px;white-space:nowrap}
.stats{max-width:760px;margin:8px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.14);border-radius:10px;padding:6px 8px;text-align:center}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12px;opacity:.9}
.progress{max-width:760px;margin:8px auto 0;height:6px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:#7ef0b0;width:0;transition:width .4s}

/* quick add */
.quick{display:flex;gap:6px;margin:12px 0}
.quick input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:12px}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--primary);color:#fff;font-weight:600}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--danger)}
.btn.sm{padding:6px 10px;font-size:14px}

.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}

/* street */
.street{background:var(--card);border-radius:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.05);overflow:hidden}
.street.empty .sname{color:var(--muted)}
.shead{display:flex;align-items:center;gap:8px;padding:12px;user-select:none;cursor:pointer}
.chev{transition:transform .2s;color:var(--muted);width:16px;text-align:center}
.street.open .chev{transform:rotate(90deg)}
.sname{font-size:18px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:13px;border-radius:999px;padding:3px 8px;background:var(--primary-soft);color:var(--primary);white-space:nowrap}
.badge.pk{background:#fff1e6;color:var(--warn)}
@media (prefers-color-scheme: dark){.badge.pk{background:#3a2516}}
.badge.zero{background:var(--ok-soft);color:var(--ok)}
.sortbtns{display:flex;gap:4px}
.sortbtns button{border:1px solid var(--line);background:var(--card);border-radius:8px;width:38px;height:36px;font-size:16px}
.grip{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;flex:none;min-width:48px;height:44px;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--muted)}
.list .li .grip{flex:none;min-width:48px}
.sorting .shead{padding:4px 6px 4px 12px;cursor:default}
.sorting .street{margin-bottom:4px}
.dragbox{user-select:none;-webkit-user-select:none}
.dragbox .street,.dragbox .li{transition:transform .15s}
.dragbox .drag{transition:none;position:relative;z-index:10;background:var(--primary-soft);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.sbody{display:none;border-top:1px solid var(--line);padding:8px 12px 12px}
.street.open .sbody{display:block}
.addrow{display:flex;gap:6px;margin-bottom:8px}
.addrow input.no{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:18px}
.addrow input.qty{width:64px;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:18px}

.items{display:flex;flex-wrap:wrap;gap:8px}
.item{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);max-width:100%}
.item .tap{border:0;background:transparent;padding:10px 12px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.item .q{font-size:14px;font-weight:700;background:var(--warn);color:#fff;border-radius:999px;padding:1px 7px}
.item .nav,.item .more{border:0;border-left:1px solid var(--line);background:transparent;padding:0 10px;font-size:18px}
.item .nav{background:var(--ok-soft)}
.item.done .tap{text-decoration:line-through;text-decoration-thickness:3px;color:var(--muted)}
.item.done{background:var(--bg)}
.item.fading{animation:fadeout 2.4s ease forwards}
.item.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{background:#ffe08a;transform:scale(1.06)}100%{transform:scale(1)}}
#toastMsg{white-space:pre-line}
@keyframes fadeout{0%,45%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.85)}}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.emptymsg{color:var(--muted);font-size:14px;padding:4px 0}

/* sheet / modal */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:700px){.mask{align-items:center}.sheet{border-radius:16px;max-width:560px}}
.sheet h3{margin:0 0 12px;font-size:19px}
.sheet .row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.sheet .row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px}
.list{border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.list .li{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.list .li span{flex:1;min-width:0}
.menu button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 4px;font-size:17px}
.menu button:last-child{border-bottom:0}
.menu .red{color:var(--danger)}
.sheet textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--card);color:var(--text)}
.small{font-size:13px;color:var(--muted)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(150%);background:#222a38;color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;z-index:60;transition:transform .25s;width:max-content;max-width:92vw;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.toast button{white-space:nowrap;flex:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast button{border:0;background:#4c8dff;color:#fff;border-radius:8px;padding:6px 12px;font-weight:700}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <select id="secSel" aria-label="選擇區段"></select>
    <button class="hbtn" id="btnCloud" aria-label="雲端同步">☁</button>
    <button class="hbtn" id="btnSort">排序</button>
    <button class="hbtn" id="btnMenu">☰</button>
  </div>
  <div class="stats">
    <div class="stat"><b id="stLoc">0</b><span>剩餘地點</span></div>
    <div class="stat"><b id="stPkg">0</b><span>剩餘包裹</span></div>
    <div class="stat"><b id="stDone">0</b><span>已完成包裹</span></div>
  </div>
  <div class="progress"><i id="prog"></i></div>
</header>

<div class="wrap">
  <div class="quick">
    <input id="quickIn" placeholder="快速輸入：北埔路101巷5號 x2" enterkeyhint="done" autocomplete="off">
    <button class="btn" id="quickBtn">新增</button>
  </div>
  <div class="toolbar">
    <button class="chip" id="tgHideEmpty">只顯示有包裹的街道</button>
    <button class="chip" id="tgShowDone">顯示已完成</button>
    <button class="chip" id="btnExpandAll">全部展開</button>
    <button class="chip" id="btnCollapseAll">全部收折</button>
  </div>
  <div id="streets"></div>
</div>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn">復原</button></div>

<script>
/* ================= 資料 ================= */
const KEY = 'parcel-helper-v1';
const DEFAULT_STREETS = ['仁義街','中興路','助人街','復興路','北埔路','光復路','自信街','建國街','自助街','民族路','自立街','民生路','自強街','民享街','華興街','華陽街','華富街','華德街','大德街(小)','大德街(大)','民有街(小)','民有街(大)','漁場街','德莊','大漢街','大華街','大同街','大有街','大行街','大賢街','太平197','康樂路','康樂路一','康樂路三','精舍街','廣安一街','廣安二街','廣安三街1','廣安三街2','廣安三街3','廣安三街5','廣安三街6','康平街','康泰街','紫園巷','紫園巷一','紫園巷二','鄉根一','鄉根二','康樂加灣','南三棧','景美加灣','佳民','佳林','樹林街','樹人街','樹德街'];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const newStreet = name => ({ id: uid(), name, items: [] });

/* 定位紀錄獨立存放：清空門牌、或另一個舊視窗存檔，都不會動到它。
   每次異動都先讀出最新內容再寫回，只改動那一筆。 */
const LOCKEY = 'parcel-helper-locations-v1';
function mergeLocs(a, b) {          // 同一地址取較新的一筆
  const m = Object.assign({}, a);
  for (const k in b) if (!m[k] || (b[k].t || 0) > (m[k].t || 0)) m[k] = b[k];
  return m;
}
function readLocs() { try { return JSON.parse(localStorage.getItem(LOCKEY)) || {}; } catch (e) { return {}; } }
function changeLocs(fn) {
  const m = readLocs(), before = Object.assign({}, m); fn(m);
  if (S.cloud) {                                   // 記下待上傳的異動
    const now = Date.now();
    for (const k in m) if (JSON.stringify(m[k]) !== JSON.stringify(before[k])) S.cloud.outbox[k] = { v: m[k] };
    for (const k in before) if (!m[k]) S.cloud.outbox[k] = { t: now };
  }
  writeLocs(m); save();
}
function writeLocs(m) {
  try { localStorage.setItem(LOCKEY, JSON.stringify(m)); } catch (e) { alert('定位儲存失敗：' + e.message); }
  S.locations = m;
}

let lastRaw = null;
function load() {
  let s = null;
  try { lastRaw = localStorage.getItem(KEY); const d = JSON.parse(lastRaw); if (d && d.sections) s = d; } catch (e) {}
  if (!s) {
    const sec = { id: uid(), name: '宗四', streets: DEFAULT_STREETS.map(newStreet) };
    s = { sections: [sec], cur: sec.id, locations: {}, hideEmpty: false, showDone: false, autoLoc: true };
  }
  const known = readLocs();
  s.locations = mergeLocs(known, s.locations || {});        // 舊版資料自動併入
  if (s.cloud) for (const k in s.locations) if (s.locations[k] !== known[k]) s.cloud.outbox[k] = { v: s.locations[k] };
  try { localStorage.setItem(LOCKEY, JSON.stringify(s.locations)); } catch (e) {}
  s.sections.forEach(x => x.streets.forEach(mergeDup));     // 舊版留下的重複門牌合併
  return s;
}
// 同一街道內，未完成的相同門牌合併成一筆
function mergeDup(street) {
  const seen = {};
  street.items = street.items.filter(i => {
    if (i.done) return true;
    if (seen[i.no]) { seen[i.no].qty += i.qty; return false; }
    seen[i.no] = i; return true;
  });
}
let S = load();
function save() {
  try { lastRaw = JSON.stringify(S); localStorage.setItem(KEY, lastRaw); } catch (e) { alert('儲存失敗：' + e.message); }
  scheduleSync();
}
// 另一個視窗改過資料時，先換成最新的，避免用舊資料覆蓋
function syncFromDisk() {
  try { if (localStorage.getItem(KEY) === lastRaw) return; } catch (e) { return; }
  const n = load();
  if (JSON.stringify([n.sections, n.locations, n.cur]) === JSON.stringify([S.sections, S.locations, S.cur])) { S.cloud = n.cloud; showCloud(); return; }
  S = n; closeSheet(); render();
}
window.addEventListener('storage', e => { if (e.key === KEY || e.key === null) syncFromDisk(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncFromDisk(); });
window.addEventListener('pageshow', e => { if (e.persisted) syncFromDisk(); });
// 請瀏覽器不要自動清掉本站資料
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

const sec = () => S.sections.find(x => x.id === S.cur) || S.sections[0];
const expanded = new Set();     // 預設收折
let sortMode = false;

/* ================= 地址解析 ================= */
const toHalf = s => s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
  .replace(/[－—–―ー‐‑‒−﹣﹘~～_]/g, '-').replace(/[ｘＸ×＊]/g, 'x').replace(/　/g, ' ')
  .replace(/\s*(-|之|巷|弄)\s*/g, '$1');   // 「101 - 5」「101巷 5號」中間的空白不算數量

// "101巷5號" -> "101-5"；"5巷5弄1號" -> "5-5-1"；"101-5" 保留
function normNo(raw) {
  let s = toHalf(raw).trim();
  s = s.replace(/號\s*之\s*(\d+)/, '之$1號'); // 12號之1 -> 12之1
  s = s.replace(/號.*$/, '');            // 號之後(樓層等)去掉
  s = s.replace(/\s*(巷|弄)\s*/g, '-');
  s = s.replace(/[^0-9之\-]+/g, '-');     // 其他符號當作分隔，不可讓數字黏在一起(101.5 -> 101-5)
  s = s.replace(/-*之-*/g, '之').replace(/-+/g, '-').replace(/^[-之]+|[-之]+$/g, '');
  return s;
}
// 解析 "101-5 x2" / "101-5*2" / "101-5 2" -> {no, qty}
function parseNoQty(raw) {
  let s = toHalf(raw).trim(), qty = 0;
  let m = s.match(/^(.*?)\s*[x*]\s*(\d+)\s*$/i);
  if (m) { s = m[1]; qty = +m[2]; }
  else if ((m = s.match(/^(.*\d.*?)\s+(\d+)\s*(個|件)?$/))) { s = m[1]; qty = +m[2]; }
  return { no: normNo(s), qty };
}
// 門牌自然排序
function cmpNo(a, b) {
  const pa = a.split(/[-之]/).map(Number), pb = b.split(/[-之]/).map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const x = pa[i] ?? -1, y = pb[i] ?? -1;
    if (x !== y) return x - y;
  }
  return 0;
}

/* ================= 定位 ================= */
const locKey = (street, no) => street + '|' + no;
function getLoc(street, no) { return S.locations[locKey(street, no)]; }
function recordLoc(street, no, silent) {
  const fail = msg => {
    if (!silent) alert('定位失敗：' + msg + '\n(手機需使用 https 網址開啟並允許定位權限)');
    else notify(`⚠ 未記錄到定位：${street} ${no}`, '重試', () => recordLoc(street, no, false));
  };
  if (!navigator.geolocation) return fail('此裝置不支援定位');
  navigator.geolocation.getCurrentPosition(p => {
    changeLocs(m => { m[locKey(street, no)] = { lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy), t: Date.now() }; });
    render();
    notify(`📍 已記錄定位：${street} ${no}`);
  }, err => fail(err.message || '逾時'), { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
}
function navTo(street, no) {
  const l = getLoc(street, no); if (!l) return;
  const ll = `${l.lat},${l.lng}`;
  const web = `https://www.google.com/maps/dir/?api=1&destination=${ll}&travelmode=driving&dir_action=navigate`;
  const ua = navigator.userAgent;
  if (/Android/i.test(ua)) {
    // 直接以經緯度啟動 Google 地圖逐步導航（開車）
    location.href = `intent://navigation?q=${ll}&mode=d#Intent;scheme=google.navigation;package=com.google.android.apps.maps;S.browser_fallback_url=${encodeURIComponent(web)};end`;
  } else if (/iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
    // iOS：開啟 Google 地圖 App 導航；沒安裝則改開網頁版
    const t = Date.now();
    location.href = `comgooglemaps://?daddr=${ll}&directionsmode=driving`;
    setTimeout(() => { if (!document.hidden && Date.now() - t < 2500) location.href = web; }, 1500);
  } else {
    window.open(web, '_blank');
  }
}

/* ================= 操作 ================= */
function addItem(street, raw, qtyField) {
  const { no, qty } = parseNoQty(raw);
  if (!no) return false;
  const q = qty || Math.max(1, parseInt(qtyField) || 1);
  const ex = street.items.find(i => i.no === no && !i.done);
  if (ex) ex.qty += q;
  else street.items.push({ id: uid(), no, qty: q, done: false });
  street.items.sort((a, b) => cmpNo(a.no, b.no));
  save();
  return { no, q, merged: !!ex, total: ex ? ex.qty : q, hasLoc: !!getLoc(street.name, no) };
}
function addedMsg(st, r) {
  return (r.merged ? `${st.name} ${r.no} 已存在，數量 +${r.q}，共 ${r.total} 件` : `已新增 ${st.name} ${r.no}` + (r.q > 1 ? ` ×${r.q}` : ''))
    + (r.hasLoc ? '　📍已有定位' : '');
}

function setUndone(sid, iid) {
  const st = S.sections.flatMap(x => x.streets).find(x => x.id === sid); const it = st && st.items.find(x => x.id === iid);
  if (!it) return;
  it.done = false; delete it.doneAt; mergeDup(st); save(); render();   // 復原時若已有相同門牌就合併
}
function toggleDone(street, item) {
  if (item.done) return setUndone(street.id, item.id);
  item.done = true; item.doneAt = Date.now();
  save(); render();
  toast(`✔ ${street.name} ${item.no}` + (item.qty > 1 ? ` (${item.qty}件)` : ''), () => setUndone(street.id, item.id));
  if (S.autoLoc) recordLoc(street.name, item.no, true);
  setTimeout(render, 2600);
}

/* ================= 畫面 ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const justDone = i => { const d = Date.now() - i.doneAt; return d >= 0 && d < 2500; };
function counts(st) {
  let loc = 0, pkg = 0, dpkg = 0;
  for (const i of st.items) { if (i.done) dpkg += i.qty; else { loc++; pkg += i.qty; } }
  return { loc, pkg, dpkg };
}

let dragging = false, composing = false, renderLater = false;
document.addEventListener('compositionstart', () => { composing = true; });
document.addEventListener('compositionend', () => { composing = false; if (renderLater) setTimeout(render, 0); });
// 重畫時保留正在輸入的文字與游標；拖曳或選字中則延後重畫
function render() {
  if (dragging || composing) { renderLater = true; return; }
  renderLater = false;
  const keep = [...document.querySelectorAll('#streets .street.open')].map(el => ({
    id: el.dataset.s, no: el.querySelector('input.no').value, qty: el.querySelector('input.qty').value,
    focus: document.activeElement && el.contains(document.activeElement) && document.activeElement.matches('input') ? document.activeElement.className : ''
  }));
  renderNow();
  keep.forEach(k => {

// 快速輸入：北埔路101巷5號 x2
function quickAdd() {
  const raw = toHalf($('quickIn').value.trim()); if (!raw) return;
  const s = sec();
  // 找最長相符的街道名稱
  // 名稱以數字結尾者(廣安三街1)，後面不可再接數字，否則 廣安三街15號 會被誤認成 廣安三街1 的 5 號
  const hit = n => raw.startsWith(n) && !(/\d$/.test(n) && /^\d/.test(raw.slice(n.length)));
  const cands = s.streets.filter(st => hit(st.name) || hit(st.name.replace(/\(.*\)/, '')))
    .sort((a, b) => b.name.length - a.name.length);
  let st = cands[0], rest;
  if (st) rest = raw.slice(raw.startsWith(st.name) ? st.name.length : st.name.replace(/\(.*\)/, '').length);
  else {
    const m = raw.match(/^(.+?(?:路|街|巷|大道))(\d.*)$/);
    if (!m) { alert('找不到符合的街道名稱，請確認輸入或先新增街道。'); return; }
    if (!confirm(`「${s.name}」沒有「${m[1]}」，要新增這條街道嗎？`)) return;
    st = newStreet(m[1]); s.streets.push(st); rest = m[2];
  }
  if (cands.length > 1 && cands[0].name.replace(/\(.*\)/, '') === cands[1].name.replace(/\(.*\)/, '') && !raw.startsWith(cands[0].name)) {
    // 例如 大德街(小)/大德街(大) 無法判斷
    const pick = prompt(`請選擇街道：\n${cands.map((c, i) => `${i + 1}. ${c.name}`).join('\n')}`, '1');
    const n = parseInt(pick); if (!n || !cands[n - 1]) return; st = cands[n - 1];
  }
  const r = addItem(st, rest, 1);
  if (!r) { alert('無法解析門牌號碼'); return; }
  $('quickIn').value = '';
  render();
  flashItem(st, r.no); toast(addedMsg(st, r));
}
function flashItem(st, no) {
  const it = st.items.find(i => i.no === no && !i.done);
  const el = it && document.querySelector(`.item[data-i="${it.id}"]`);
  if (el) el.classList.add('flash');
}

/* ================= 拖曳排序 =================
   按住 ≡ 拖曳（滑鼠與觸控共用）。拖到畫面上下邊緣會自動捲動。 */
function moveStreet(from, to) {
  const a = sec().streets; a.splice(to, 0, a.splice(from, 1)[0]); save();
}
function makeSortable(box, itemSel, getScroller, onDrop) {
  box.addEventListener('pointerdown', e => {
    const grip = e.target.closest('[data-grip]');
    if (!grip || dragging || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const els = [...box.querySelectorAll(itemSel)], el = grip.closest(itemSel), from = els.indexOf(el);
    if (from < 0) return;
    e.preventDefault();
    const sc = getScroller(), isDoc = sc === document.scrollingElement;
    const top0 = sc.scrollTop, startY = e.clientY;
    const rects = els.map(x => x.getBoundingClientRect());
    const step = els.length > 1 ? Math.abs(rects[from === 0 ? 1 : from].top - rects[from === 0 ? 0 : from - 1].top) : rects[0].height;
    const mids = rects.map(r => r.top + r.height / 2);
    let y = startY, to = from, raf = 0;
    dragging = true; el.classList.add('drag'); box.classList.add('dragbox');
    try { grip.setPointerCapture(e.pointerId); } catch (_) {}

    const place = () => {
      const dy = y - startY + sc.scrollTop - top0, mid = mids[from] + dy;
      el.style.transform = `translateY(${dy}px)`;
      to = from;
      while (to < els.length - 1 && mid > mids[to + 1]) to++;
      while (to > 0 && mid < mids[to - 1]) to--;
      els.forEach((x, i) => {
        if (i === from) return;
        const sh = i > from && i <= to ? -step : i < from && i >= to ? step : 0;
        x.style.transform = sh ? `translateY(${sh}px)` : '';
      });
    };
    const tick = () => {                         // 邊緣自動捲動
      const b = isDoc ? { top: document.querySelector('header').offsetHeight, bottom: innerHeight } : sc.getBoundingClientRect();
      const zone = 70, up = b.top + zone - y, down = y - (b.bottom - zone);
      const v = up > 0 ? -Math.min(up, zone) : down > 0 ? Math.min(down, zone) : 0;
      if (v) { const max = sc.scrollHeight - sc.clientHeight; sc.scrollTop = Math.max(0, Math.min(max, sc.scrollTop + v / 4)); place(); }
      raf = requestAnimationFrame(tick);
    };
    const move = ev => { if (ev.pointerId === e.pointerId) { y = ev.clientY; place(); } };
    const end = ev => {
      if (ev.pointerId !== e.pointerId) return;
      cancelAnimationFrame(raf);
      removeEventListener('pointermove', move); removeEventListener('pointerup', end); removeEventListener('pointercancel', end);
      box.classList.remove('dragbox'); el.classList.remove('drag');
      els.forEach(x => { x.style.transform = ''; });
      dragging = false;
      if (ev.type === 'pointerup' && to !== from) onDrop(from, to);
      else if (renderLater) render();
    };
    addEventListener('pointermove', move); addEventListener('pointerup', end); addEventListener('pointercancel', end);
    raf = requestAnimationFrame(tick);
  });
}
makeSortable($('streets'), '.street', () => document.scrollingElement, (f, t) => { moveStreet(f, t); render(); });

/* ================= Toast ================= */
let toastTimer, toastUndo;
function toast(msg, undo, label) {
  $('toastMsg').textContent = msg; toastUndo = undo;
  $('toastBtn').textContent = label || '復原';
  $('toastBtn').style.display = undo ? '' : 'none';
  $('toast').classList.add('show');
  holdToast(undo ? 4000 : 2200);
}
function holdToast(ms) {
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastUndo = null; $('toast').classList.remove('show'); }, ms);
}
// 背景通知（定位結果）：若「復原」還在畫面上，就接在後面顯示，不蓋掉復原按鈕
function notify(msg, label, act) {
  if (toastUndo) { $('toastMsg').textContent += '\n' + msg; holdToast(4000); }
  else toast(msg, act, label);
}
$('toastBtn').onclick = () => {
  const f = toastUndo; toastUndo = null; $('toast').classList.remove('show');
  f && f();
};

    </div>`, sh => sh.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
      const m = b.dataset.m; closeSheet();

      else if (m === 'qty') { const v = parseInt(prompt('數量', it.qty)); if (v > 0) { it.qty = v; save(); render(); } }
      else if (m === 'edit') {
        const v = prompt('門牌（例如 101-5）', it.no); if (v == null) return;
        const n = normNo(v); if (!n) return;
        const oldL = getLoc(st.name, it.no);
        if (oldL && !getLoc(st.name, n)) changeLocs(m => { m[locKey(st.name, n)] = oldL; });
        it.no = n; mergeDup(st); st.items.sort((a, b) => cmpNo(a.no, b.no)); save(); render();
      }

    }));

function locMgr() {
  const keys = Object.keys(S.locations).sort();
  openSheet(`<h3>定位紀錄（${keys.length}）</h3>
    <div class="row"><input id="lq" placeholder="搜尋，例如 北埔路"></div>
    <div class="list" id="ll"></div><button class="btn ghost" id="close">關閉</button>`, sh => {
    const draw = () => {
      const q = sh.querySelector('#lq').value.trim();
      const ks = keys.filter(k => !q || k.includes(q));
      sh.querySelector('#ll').innerHTML = ks.map(k => { const [st, no] = k.split('|'); return `<div class="li"><span>${esc(st)} ${esc(no)}</span><button class="btn sm" data-k="${esc(k)}" data-a="nav">導航</button><button class="btn danger sm" data-k="${esc(k)}" data-a="del">刪除</button></div>`; }).join('') || '<div class="li"><span class="small">沒有紀錄</span></div>';
      sh.querySelectorAll('#ll button').forEach(b => b.onclick = () => {
        const [st, no] = b.dataset.k.split('|');
        if (b.dataset.a === 'nav') navTo(st, no);
        else if (confirm('刪除此定位紀錄？')) { changeLocs(m => { delete m[b.dataset.k]; }); keys.splice(keys.indexOf(b.dataset.k), 1); render(); draw(); }
      });
    };
    sh.querySelector('#lq').oninput = draw; draw();
    sh.querySelector('#close').onclick = closeSheet;
  });
}

function backupMgr() {
  openSheet(`<h3>備份 / 還原</h3>
    <p class="small">資料儲存在這台裝置的瀏覽器內。換手機或換瀏覽器前，請先下載備份檔，再到新裝置還原。</p>
    <div class="row"><button class="btn" id="dl">下載備份檔</button><button class="btn ghost" id="ul">從備份檔還原</button>
    <input type="file" id="file" accept=".json,application/json" hidden></div>
    <button class="btn ghost" id="close">關閉</button>`, sh => {
    sh.querySelector('#close').onclick = closeSheet;
    sh.querySelector('#dl').onclick = () => {
      const blob = new Blob([JSON.stringify(Object.assign({}, S, { cloud: undefined /* 備份檔不含連線密碼 */ }), null, 1)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `包裹遞送備份_${new Date().toISOString().slice(0, 10)}.json`; a.click();
    };
    sh.querySelector('#ul').onclick = () => sh.querySelector('#file').click();
    sh.querySelector('#file').onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      f.text().then(t => {
        try { const d = JSON.parse(t); if (!d.sections) throw 0; if (!confirm('還原會覆蓋目前的區段、街道與門牌（定位紀錄會合併，同地址取較新的），確定？')) return; const cl = S.cloud, dl = d.locations || {}; S = d; delete S.cloud; if (cl) S.cloud = cl; d.locations = dl; changeLocs(m => Object.assign(m, mergeLocs(m, d.locations || {}))); expanded.clear(); render(); closeSheet(); toast('還原完成'); }
        catch (_) { alert('檔案格式不正確'); }
      });
    };
  });
}

/* ================= 雲端同步（Google 試算表） =================
   S.cloud = { url, key, dev, rev, base, pending, outbox, fp, lastOk, err, hold }
   base    ：上次與雲端一致時的區段/街道/門牌（JSON 字串），用來三方合併
   dev     ：這台裝置的代號
   pending ：已送出但還沒確認的那一版。有它在時，先向雲端確認收到沒，再送新的
   outbox  ：待上傳的定位異動；先存在本機，連上網再補傳 */
const normSections = list => list.map(s => ({
  id: s.id, name: s.name, streets: s.streets.map(st => ({
    id: st.id, name: st.name, items: st.items.map(i => {
      const o = { id: i.id, no: i.no, qty: i.qty, done: !!i.done }; if (i.done) o.doneAt = i.doneAt || 0; return o;
    }).sort((a, b) => cmpNo(a.no, b.no) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0))
  }))
}));
const docOf = () => JSON.stringify(normSections(S.sections));

// 三方合併：base 為共同起點，l 本機、r 雲端
function mergeList(b, l, r, kid) {
  const B = new Map((b || []).map(x => [x.id, x])), L = new Map(l.map(x => [x.id, x])), R = new Map(r.map(x => [x.id, x]));
  const same = (x, y) => JSON.stringify(x) === JSON.stringify(y);
  const pick = id => {
    const bb = B.get(id), ll = L.get(id), rr = R.get(id);
    if (ll && rr) return mergeObj(bb, ll, rr, kid);
    const one = ll || rr;                             // 只剩一邊有
    if (!bb) return one;                              // 新增的
    if (!kid) return one.qty > bb.qty ? Object.assign({}, one, { qty: one.qty - bb.qty }) : null;  // 門牌已被刪：只留後來多加的件數
    return same(bb, one) ? null : one;                // 另一邊刪了：沒改過就跟著刪
  };
  const common = new Set([...B.keys()].filter(id => L.has(id)));
  const moved = !same((b || []).map(x => x.id).filter(id => common.has(id)), l.map(x => x.id).filter(id => common.has(id)));
  const first = moved ? l : r, other = moved ? r : l;
  const order = first.map(x => x.id);
  other.forEach((x, i) => {                           // 另一邊獨有的，插在它原本前一筆的後面
    if (order.includes(x.id)) return;
    const prev = i ? order.indexOf(other[i - 1].id) : -1;
    order.splice(i && prev < 0 ? order.length : prev + 1, 0, x.id);
  });
  return order.map(pick).filter(Boolean);
}
function mergeObj(b, l, r, kid) {
  b = b || {};
  const o = {};
  for (const f of new Set([...Object.keys(l), ...Object.keys(r)])) {
    if (f === kid) o[f] = mergeList(b[f], l[f], r[f], f === 'streets' ? 'items' : '');
    else if (f === 'qty' && b.qty) o.qty = Math.max(1, l.qty + r.qty - b.qty);  // 兩邊都有加，合計
    else { const v = JSON.stringify(l[f]) !== JSON.stringify(b[f]) ? l[f] : r[f]; if (v !== undefined) o[f] = v; }
  }
  // 一邊畫掉、另一邊同時又加件：多出來的件數仍要送，不可一起算成已完成
  const add = !b.done && l.done && !r.done ? r.qty - b.qty : !b.done && r.done && !l.done ? l.qty - b.qty : 0;
  if (add > 0) { o.done = false; o.qty = add; }
  if (!o.done) delete o.doneAt;
  return o;
}
function mergeDocs(baseJ, l, r) {
  // 先複製：合併時會改動內容，不可動到傳入的雲端原件
  const m = JSON.parse(JSON.stringify(mergeList(baseJ ? JSON.parse(baseJ) : [], l, r, 'streets')));
  // 相同門牌合併時保留雲端那一筆，本機新增的件數加上去
  const onCloud = new Set(r.flatMap(s => s.streets.flatMap(t => t.items.map(i => i.id))));
  m.forEach(s => s.streets.forEach(t => { t.items.sort((x, y) => onCloud.has(y.id) - onCloud.has(x.id)); mergeDup(t); }));
  return normSections(m);
}

async function callCloud(url, body) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), 30000);
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), credentials: 'omit', redirect: 'follow', signal: ac.signal });
    const j = await r.json();
    if (!j.ok) throw new Error({ auth: '連線密碼不正確', setup: '試算表還沒執行 setup', busy: '雲端忙碌中' }[j.error] || j.error);
    return j;
  } catch (e) {
    if (e.name === 'AbortError' || e instanceof TypeError) throw Object.assign(new Error('連不上雲端（沒網路或網址不正確）'), { net: true });
    if (e instanceof SyntaxError) throw new Error('雲端回應不正確，請檢查網址與部署權限');
    throw e;
  } finally { clearTimeout(t); }
}

let syncing = false, syncTimer = 0;
const cloudDirty = () => !!S.cloud && (Object.keys(S.cloud.outbox).length > 0 || docOf() !== S.cloud.base);
function scheduleSync(ms) {
  if (!S.cloud) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(() => { if (cloudDirty()) syncNow(); }, ms || 1500);
}
// 使用者正在操作選單、拖曳、選字時，先不套用雲端資料
const uiBusy = () => dragging || composing || ($('mask').classList.contains('show') && sheetKind !== 'cloud');

async function syncNow() {
  if (!S.cloud || syncing) return;
  syncing = true; showCloud();
  const run = async () => {
    try {
      for (let i = 0; i < 5 && S.cloud; i++) {
        const again = await syncOnce();
        if (!again) break;
      }
      if (S.cloud) { S.cloud.err = ''; S.cloud.lastOk = Date.now(); save(); }
    } catch (e) { if (S.cloud) { S.cloud.err = e.message; S.cloud.net = !!e.net; save(); } }
  };
  try {
    if (navigator.locks) await navigator.locks.request('parcel-sync', { ifAvailable: true }, lk => lk && run());
    else await run();
  } finally {
    clearTimeout(syncTimer);
    syncing = false; showCloud();
    if (S.cloud && !S.cloud.err && cloudDirty()) scheduleSync(3000);
    if (sheetKind === 'cloud' && $('mask').classList.contains('show') && S.cloud && !$('cUrl')) cloudMgr();
  }
}

// 一次往返；回傳 true 表示還有東西要再同步
async function syncOnce() {
  let C = S.cloud; const url = C.url;
  if (uiBusy()) { scheduleSync(4000); return false; }
  const cur = docOf(), sent = Object.assign({}, C.outbox);
  const body = { key: C.key, dev: C.dev, rev: C.rev || '', fp: C.fp || '', ops: Object.keys(sent).map(k => Object.assign({ k }, sent[k])) };
  if (C.pending) body.cancel = C.pending.id;
  else if (cur !== C.base) {
    body.doc = cur; body.pushId = uid();
    C.pending = { id: body.pushId, doc: cur };
    save();
  }
  const res = await callCloud(url, body);
  C = S.cloud; if (!C || C.url !== url) return false;
  if (uiBusy()) { scheduleSync(4000); return false; }   // 等使用者操作完再套用；pending 保留供下次判斷

  /* 定位 */
  for (const k in sent) if (JSON.stringify(C.outbox[k]) === JSON.stringify(sent[k])) delete C.outbox[k];
  const local = readLocs();
  let next = res.locs ? Object.assign({}, res.locs) : Object.assign({}, local);
  if (res.results) for (const k in res.results) { if (res.results[k]) next[k] = res.results[k]; else delete next[k]; }
  if (res.locs) {
    const lost = Object.keys(local).filter(k => !next[k] && !C.outbox[k] && !sent[k]);
    if (C.allowDrop) { delete C.allowDrop; delete C.hold; }
    else if (lost.length > Math.max(5, Object.keys(local).length * 0.2)) {
      // 雲端一次少很多筆，可能是試算表被誤刪：先保留本機，等使用者決定
      lost.forEach(k => { next[k] = local[k]; }); C.hold = lost;
    } else delete C.hold;
  }
  for (const k in C.outbox) { if (C.outbox[k].v) next[k] = C.outbox[k].v; else delete next[k]; }
  C.fp = C.hold ? '' : res.fp;

  /* 區段、街道、門牌 */
  const mine = docOf();
  let base = C.base;
  if (C.pending && res.last === C.pending.id) base = C.pending.doc;   // 之前送出的其實已被雲端收下
  C.pending = null;
  if (res.accepted) { C.base = body.doc; C.rev = res.rev; }
  else if (res.rev !== (C.rev || '')) {
    if (res.doc) {
      const remote = normSections(JSON.parse(res.doc));
      S.sections = mergeDocs(base, JSON.parse(mine), remote);
      C.base = JSON.stringify(remote);
    } else C.base = null;                               // 雲端是空的，下一輪重新上傳
    C.rev = res.rev;
  }
  const changed = docOf() !== mine || JSON.stringify(next) !== JSON.stringify(local);
  writeLocs(next); save();
  if (changed) render();
  return cloudDirty();
}

function showCloud() {
  const b = $('btnCloud'), C = S.cloud;
  b.textContent = !C ? '☁' : syncing ? '☁⟳' : C.hold || (C.err && !C.net) ? '☁⚠' : C.err || cloudDirty() ? '☁↑' : '☁✓';
}
$('btnCloud').onclick = () => cloudMgr();

const encodeLink = C => btoa(JSON.stringify([C.url, C.key])).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
function decodeLink(s) { try { const a = JSON.parse(atob(s.trim().replace(/-/g, '+').replace(/_/g, '/'))); return Array.isArray(a) && a.length === 2 ? a : null; } catch (e) { return null; } }

async function connectCloud(url, key) {
  url = url.trim(); key = key.trim();
  if (!/^https:\/\/script\.google\.com\/macros\/(a\/[^/]+\/)?s\/[\w-]+\/exec$/.test(url)) return alert('網址不正確。應為 https://script.google.com/macros/s/……/exec');
  if (!key) return alert('請輸入連線密碼');
  let r;
  try { r = await callCloud(url, { key, rev: '', fp: '', ops: [] }); } catch (e) { return alert('連線失敗：' + e.message); }
  const start = useCloud => {
    const outbox = {}; for (const k in readLocs()) outbox[k] = { v: readLocs()[k] };   // 本機定位全部併入雲端
    S.cloud = { url, key, dev: uid(), rev: r.rev, base: null, pending: null, outbox, fp: '' };
    if (r.doc) {
      const remote = normSections(JSON.parse(r.doc));
      S.cloud.base = JSON.stringify(remote);
      if (useCloud) { S.sections = JSON.parse(S.cloud.base); S.cur = (S.sections[0] || {}).id; expanded.clear(); }
    }
    save(); render(); cloudMgr(); syncNow();
  };
  const fresh = S.sections.length === 1 && S.sections[0].streets.every(x => !x.items.length) && S.sections[0].streets.map(x => x.name).join() === DEFAULT_STREETS.join();
  if (!r.doc || fresh) return start(!!r.doc);
  const d = JSON.parse(r.doc), n = d.reduce((a, s) => a + s.streets.reduce((x, t) => x + t.items.length, 0), 0);
  openSheet(`<h3>雲端已經有資料</h3><p class="small">雲端：${d.map(s => esc(s.name)).join('、')}，共 ${n} 個門牌。<br>區段、街道與門牌要以哪一邊為準？（定位紀錄兩邊會合併，不受影響）</p>
    <div class="menu"><button id="cA">☁ 用雲端的（這台的區段與門牌會被取代）</button><button id="cB" class="red">📱 用這台的（雲端的區段與門牌會被取代）</button><button id="cC">取消</button></div>`, sh => {
    sh.querySelector('#cA').onclick = () => start(true);
    sh.querySelector('#cB').onclick = () => { if (confirm('確定用這台的資料取代雲端的區段與門牌？')) start(false); };
    sh.querySelector('#cC').onclick = closeSheet;
  }, 'cloud');
}

function cloudMgr() {
  const C = S.cloud;
  if (!C) return openSheet(`<h3>☁ 雲端同步（Google 試算表）</h3>
    <p class="small">第一次使用請先用電腦完成設定：<a href="setup.html" target="_blank">開啟設定教學</a>。<br>連線後，定位、區段、街道順序與門牌都會存到你的試算表，換手機也能接著用。</p>
    <div class="row"><input id="cUrl" placeholder="網頁應用程式網址（https://script.google.com/…/exec）" autocomplete="off"></div>
    <div class="row"><input id="cKey" placeholder="連線密碼" autocomplete="off" autocapitalize="off"></div>
    <p class="small">已經有其他裝置連線？把那台的「連線碼」貼在這裡就好：</p>
    <div class="row"><input id="cCode" placeholder="連線碼" autocomplete="off" autocapitalize="off"></div>
    <div class="row"><button class="btn" id="go">連線</button><button class="btn ghost" id="close">關閉</button></div>`, sh => {
    sh.querySelector('#close').onclick = closeSheet;
    sh.querySelector('#go').onclick = async e => {
      const code = sh.querySelector('#cCode').value, a = code.trim() ? decodeLink(code) : [sh.querySelector('#cUrl').value, sh.querySelector('#cKey').value];
      if (!a) return alert('連線碼不正確，請重新複製');
      e.target.disabled = true; e.target.textContent = '連線中…';
      await connectCloud(a[0], a[1]);
      e.target.disabled = false; e.target.textContent = '連線';
    };
  }, 'cloud');
  const n = Object.keys(C.outbox).length, dd = docOf() !== C.base;
  openSheet(`<h3>☁ 雲端同步</h3>
    <p>${syncing ? '同步中…' : C.err ? '⚠ ' + esc(C.err) : cloudDirty() ? '有資料等待上傳' : '✅ 已同步'}</p>
    <p class="small">上次成功：${C.lastOk ? new Date(C.lastOk).toLocaleString() : '尚未'}<br>待上傳定位：${n} 筆　門牌異動：${dd ? '有' : '無'}<br>本機定位：${Object.keys(S.locations).length} 筆</p>
    ${C.hold ? `<p>⚠ 雲端試算表少了 <b>${C.hold.length}</b> 筆定位，可能被誤刪。這台手機仍保留著。</p>
      <div class="row"><button class="btn" id="keep">補回雲端</button><button class="btn danger" id="drop">照雲端刪除</button></div>` : ''}
    <div class="menu">
      <button id="now">🔄 立即同步</button>
      <button id="copy">📋 複製連線碼（給另一台手機用）</button>
      <button id="off" class="red">中斷連線（資料都會保留）</button>
      <button id="close">關閉</button></div>
    <p class="small">連線碼等於密碼，請不要傳給別人。</p>`, sh => {
    const on = (id, f) => { const b = sh.querySelector('#' + id); if (b) b.onclick = f; };
    on('close', closeSheet);
    on('now', () => { syncNow(); if (syncing) cloudMgr(); });
    on('copy', async () => {
      const c = encodeLink(C);
      try { await navigator.clipboard.writeText(c); toast('已複製連線碼'); } catch (e) { prompt('請複製連線碼', c); }
    });
    on('off', () => { if (confirm('中斷雲端同步？這台的資料與試算表的資料都會保留。' + (cloudDirty() ? '\n注意：還有資料沒上傳！' : ''))) { delete S.cloud; save(); render(); closeSheet(); } });
    on('keep', () => { C.hold.forEach(k => { if (S.locations[k]) C.outbox[k] = { v: S.locations[k] }; }); delete C.hold; save(); cloudMgr(); syncNow(); });
    on('drop', () => { if (confirm(`確定從這台刪除 ${C.hold.length} 筆定位？`)) { C.allowDrop = true; C.fp = ''; save(); syncNow(); } });
  }, 'cloud');
}

document.addEventListener('visibilitychange', () => { if (document.hidden) { if (cloudDirty()) syncNow(); } else syncNow(); });
window.addEventListener('online', () => syncNow());
setInterval(() => { if (!document.hidden) syncNow(); }, 60000);

render();
syncNow();
</script>
